;
; Supported features of the 'hns5' crypto driver.
;
; Refer to default.ini for the full list of available PMD features.
;
[Features]
Symmetric crypto       = Y
HW Accelerated         = Y
Operation chaining     = Y
In place SGL           = Y
OOP SGL in LB out      = Y

;
; Supported crypto algorithms of the 'hns5' crypto driver.
;
[Cipher]
SM4 CBC (128)  = Y
AES CBC (128)  = Y
AES CBC (192)  = Y
AES CBC (256)  = Y
AES ECB (128)  = Y
AES ECB (192)  = Y
AES ECB (256)  = Y

;
; Supported authentication algorithms of the 'hns5' crypto driver.
;
[Auth]
SM3          = Y
SHA256       = Y
SHA256 HMAC  = Y

;
; Supported AEAD algorithms of the 'hns5' crypto driver.
;
[AEAD]

;
; Supported Asymmetric algorithms of the 'hns5' crypto driver.
;
[Asymmetric]

;
; Supported Operating systems of the 'hns5' crypto driver.
;
[OS]
Linux = Y

;
; Supported features of the 'hns5' network poll mode driver.
;
; Refer to default.ini for the full list of available PMD features.
;
[Features]
Speed capabilities   = Y
Link status          = Y
Link status event    = Y
Queue start/stop     = Y
Runtime Rx queue setup = Y
Runtime Tx queue setup = Y
MTU update           = Y
Scattered Rx         = Y
TSO                  = Y
L3 checksum passthrough = Y
L4 checksum passthrough = Y
VLAN offloading     = Y
RSS                  = Y
Flow API            = Y
Traffic management   = Y
;

;
; Supported OS of the 'hns5' network poll mode driver.
;
[OS]
Linux = Y
